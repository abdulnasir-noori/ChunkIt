<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Assignment Tracker</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; color: #111; }
      nav { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
      nav .spacer { margin-left: auto; }
      nav button.active { font-weight: 700; text-decoration: underline; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .stack { display: grid; gap: 8px; }
      .card { border: 1px solid #ddd; border-left: 5px solid #999; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
      .bar { background: #e5e7eb; border-radius: 6px; height: 10px; margin: 6px 0; }
      .bar > div { height: 100%; border-radius: 6px; background: #3b82f6; }
      .bar > div.full { background: #16a34a; }
      .err { color: crimson; }
      .muted { color: #666; }
      .tag { font-size: 12px; padding: 1px 6px; border-radius: 10px; background: #eee; }
      .tag.high { background: #fecaca; }
      .tag.medium { background: #fde68a; }
      .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cell { min-height: 80px; border: 1px solid #eee; padding: 4px; font-size: 12px; }
      .chip { color: #fff; border-radius: 4px; padding: 1px 4px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
